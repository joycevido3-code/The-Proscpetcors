name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Prospector_GitHub_APK.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: app
      - run: npx cap add android
        working-directory: app
      - name: Icona
        working-directory: app
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert www/icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
      - run: npx cap sync android
        working-directory: app
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: Prospector-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
